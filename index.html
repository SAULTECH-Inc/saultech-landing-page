<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/saultech-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>SaulTech | Custom Software Development & Cloud Solutions</title>
    <meta name="description" content="SaulTech delivers bespoke software development, web & mobile applications, UI/UX design, cloud architecture, and DevOps backed by 24/7 support." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx">
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark')
    }
    </script>
  </body>
</html>
